name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Testes
        run: node tests/move-help.test.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gerar configuração do Firebase
        env:
          FIREBASE_ENV: ${{ secrets.FIREBASE_ENV }}
        run: |
          if [ -z "$FIREBASE_ENV" ]; then
            echo "::error::Crie o segredo FIREBASE_ENV com o conteúdo do seu .env (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          printf '%s\n' "$FIREBASE_ENV" > .env
          python server.py --build
          rm .env

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
